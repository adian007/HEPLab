# Software, numerical Rust and documentation checks. Independent physics-model
# acceptance and large micro-closure jobs remain separate delivery gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_site_contract.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore web/HEPLab.Web/HEPLab.Web.csproj
      - run: dotnet build web/HEPLab.Web/HEPLab.Web.csproj --no-restore --configuration Release
      - run: python tools/check_site_runtime.py --app web/HEPLab.Web/bin/Release/net10.0/HEPLab.Web.dll --content-root web/HEPLab.Web
      - run: dotnet publish web/HEPLab.Web/HEPLab.Web.csproj --no-build --configuration Release --output .cache/heplab-web
      - run: python tools/check_site_runtime.py --app .cache/heplab-web/HEPLab.Web.dll

  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.8.4" "mypy==1.14.1" "types-PyYAML>=6"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - run: uv sync --locked --extra dev --extra serve --extra analysis
      - run: uv build --wheel --out-dir dist
      - run: uv run --no-sync python tools/verify_wheel.py dist/heplab-0.1.0.dev0-py3-none-any.whl
      - name: Install the built wheel into the locked test environment
        shell: bash
        run: >-
          uv run --no-sync python -c "import glob,subprocess,sys;
          wheel=glob.glob('dist/*.whl')[0];
          subprocess.check_call(['uv','pip','install','--python',sys.executable,'--no-deps','--reinstall',wheel])"
      - run: uv run --no-sync python -m pytest -q

  native-opengl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt X11 and Mesa runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libegl-mesa0 libopengl0 libgl1-mesa-dri libglx-mesa0 \
            libfontconfig1 libice6 libsm6 libx11-xcb1 libxi6 libxrender1 \
            libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Install native viewport test dependencies
        run: python -m pip install "PySide6>=6.8" "pytest>=8" "PyYAML>=6"
      - name: Verify perspective and orthographic RPC fades
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
          HEPLAB_REQUIRE_OPENGL: "1"
          PYTHONPATH: src
        run: >-
          xvfb-run -a python -m pytest -v -s
          'tests/test_native_event_display.py::test_rpc_outline_fade_keeps_perimeter_and_reverses_with_zoom[perspective]'
          'tests/test_native_event_display.py::test_rpc_outline_fade_keeps_perimeter_and_reverses_with_zoom[orthographic]'

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv sync --locked --extra docs --extra dev
      - run: uv run --no-sync python tools/check_handbook.py
      - run: uv run --no-sync python tools/run_verification_registry.py
      - run: npm install --prefix .cache/handbook-tools --ignore-scripts --no-audit --no-fund mermaid@12.2.0 jsdom@26.1.0
      - run: node tools/check_mermaid.mjs
      - run: node --check src/heplab/server/static/workbench.js
      - run: node --check src/heplab/server/static/event-display-gl.js
      - run: node --check src/heplab/server/static/detector-cutaway.js
      - run: node --check src/heplab/server/static/data-workspace.js
      - run: node --test tools/test_event_display.cjs
      - run: uv run --no-sync python -m mkdocs build --strict --site-dir .cache/handbook-site

  scientific-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernels
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv sync --locked --extra analysis --extra serve --extra dev
      - run: uvx --from "maturin==1.16.0" maturin build --release --locked --manifest-path kernels/Cargo.toml --out .cache/kernel-wheels
      - run: uv pip install --no-deps --find-links .cache/kernel-wheels heplab-kernels
      - run: uv run --no-sync python -m pytest -q
        env:
          HEPLAB_REQUIRE_KERNELS: "1"
      - run: uv build --wheel --out-dir .cache/wheels
      - run: uv run --no-sync python tools/verify_wheel.py .cache/wheels/heplab-0.1.0.dev0-py3-none-any.whl

  rust-physics:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            .cache/cargo-target
          key: rust-physics-${{ runner.os }}-${{ hashFiles('kernels/**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-physics-${{ runner.os }}-
      - run: cargo fmt --manifest-path kernels/physics-core/Cargo.toml --check
      - run: cargo fmt --manifest-path kernels/Cargo.toml --check
      - run: cargo test --locked --manifest-path kernels/physics-core/Cargo.toml
      - run: cargo clippy --locked --manifest-path kernels/physics-core/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --release --manifest-path kernels/physics-core/Cargo.toml
      - run: cargo build --locked --manifest-path kernels/Cargo.toml
      - run: python tools/verify_rust_engine.py --binary .cache/cargo-target/release/heplab-physics --extension .cache/cargo-target/debug/libheplab_kernels.so

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t heplab-base:ci .
      - run: docker run --rm heplab-base:ci version
