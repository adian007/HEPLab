# Software, numerical Rust and documentation checks. Independent physics-model
# acceptance and large micro-closure jobs remain separate delivery gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.8.4" "mypy==1.14.1" "types-PyYAML>=6"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - run: uv sync --locked --extra dev --extra serve --extra analysis
      - run: uv build --wheel --out-dir dist
      - run: uv run --no-sync python tools/verify_wheel.py dist/heplab-0.1.0.dev0-py3-none-any.whl
      - name: Install the built wheel into the locked test environment
        shell: bash
        run: >-
          uv run --no-sync python -c "import glob,subprocess,sys;
          wheel=glob.glob('dist/*.whl')[0];
          subprocess.check_call(['uv','pip','install','--python',sys.executable,'--no-deps','--reinstall',wheel])"
      - run: uv run --no-sync python -m pytest -q

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv sync --locked --extra docs --extra dev
      - run: uv run --no-sync python tools/check_handbook.py
      - run: npm install --prefix .cache/handbook-tools --ignore-scripts --no-audit --no-fund mermaid@12.2.0 jsdom@26.1.0
      - run: node tools/check_mermaid.mjs
      - run: node --check src/heplab/server/static/workbench.js
      - run: node --check src/heplab/server/static/event-display-gl.js
      - run: node --check src/heplab/server/static/detector-cutaway.js
      - run: node --check src/heplab/server/static/data-workspace.js
      - run: node --test tools/test_event_display.cjs
      - run: uv run --no-sync python -m mkdocs build --strict --site-dir .cache/handbook-site

  scientific-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernels
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv sync --locked --extra analysis --extra serve --extra dev
      - run: uvx --from "maturin==1.16.0" maturin build --release --locked --manifest-path kernels/Cargo.toml --out .cache/kernel-wheels
      - run: uv pip install --no-deps --find-links .cache/kernel-wheels heplab-kernels
      - run: uv run --no-sync python -m pytest -q
        env:
          HEPLAB_REQUIRE_KERNELS: "1"
      - run: uv build --wheel --out-dir .cache/wheels
      - run: uv run --no-sync python tools/verify_wheel.py .cache/wheels/heplab-0.1.0.dev0-py3-none-any.whl

  rust-physics:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            .cache/cargo-target
          key: rust-physics-${{ runner.os }}-${{ hashFiles('kernels/**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-physics-${{ runner.os }}-
      - run: cargo fmt --manifest-path kernels/physics-core/Cargo.toml --check
      - run: cargo fmt --manifest-path kernels/Cargo.toml --check
      - run: cargo test --locked --manifest-path kernels/physics-core/Cargo.toml
      - run: cargo clippy --locked --manifest-path kernels/physics-core/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --release --manifest-path kernels/physics-core/Cargo.toml
      - run: cargo build --locked --manifest-path kernels/Cargo.toml
      - run: python tools/verify_rust_engine.py --binary .cache/cargo-target/release/heplab-physics --extension .cache/cargo-target/debug/libheplab_kernels.so

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t heplab-base:ci .
      - run: docker run --rm heplab-base:ci version
