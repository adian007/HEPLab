# Build and test the native Workbench from a source checkout.
name: Desktop

on:
  push:
    branches: [main, codex/windows-portable-smoke]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 Workbench
    runs-on: windows-2022
    outputs:
      smoke-kit-id: ${{ steps.smoke-kit.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          setup-python: false
      - name: Install the locked Python worker environment
        run: uv sync --locked --python 3.12 --no-editable --no-dev --extra serve --extra analysis
      - name: Configure the Workbench
        run: >-
          cmake -S . -B build/desktop-ci -G "Visual Studio 17 2022" -A x64
          -DHEPLAB_BUILD_TESTS=ON "-DQt6_DIR=$env:QT_ROOT_DIR/lib/cmake/Qt6"
      - name: Build the Workbench and native tests
        run: cmake --build build/desktop-ci --config Release --parallel
      - name: Build and install the worker's Rust extension
        run: |
          uvx --from "maturin==1.16.0" maturin build --release --locked --interpreter .venv/Scripts/python.exe --manifest-path kernels/Cargo.toml --out build/worker-wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --no-deps --find-links build/worker-wheels heplab-kernels
      - name: Stage the standalone Windows bundle
        run: |
          uv pip install "pyinstaller==6.22.3" "pyinstaller-hooks-contrib==2026.9"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe desktop/package_windows.py --exe build/desktop-ci/desktop/Release/HEPLabWorkbench.exe --qt-bin "$env:QT_ROOT_DIR/bin" --output build/HEPLabWorkbench-win-x64
      - name: Stage the package verification kit
        run: |
          $kit = New-Item -ItemType Directory build/HEPLabWorkbench-smoke
          Copy-Item desktop/verify_windows_package.ps1,build/desktop-ci/desktop/Release/heplab_desktop_tests.exe,"$env:QT_ROOT_DIR/bin/Qt6Test.dll" -Destination $kit.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: HEPLabWorkbench-win-x64-unsigned
          path: build/HEPLabWorkbench-win-x64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: smoke-kit
        with:
          name: HEPLabWorkbench-win-x64-smoke
          path: build/HEPLabWorkbench-smoke/
          if-no-files-found: error
      - name: Test the Workbench and local worker
        run: |
          # The hosted runner's default OpenGL cannot compile the Workbench's GLSL 3.30 shaders.
          # Use llvmpipe for this test step only. The release bundle keeps Qt's normal runtime.
          $mesa = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'heplab-mesa')
          $archive = Join-Path $mesa.FullName 'mesa3d.7z'
          curl.exe --fail --location --silent --show-error --retry 3 --output $archive https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/mesa3d-26.2.6-release-mingw.7z
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'da0f71d9181b672c1918f3c342f11118c687f6059a46b16502845160733cc388') {
            throw 'Mesa archive checksum mismatch.'
          }
          tar.exe -xf $archive -C $mesa.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $driverDir = Join-Path $mesa.FullName 'x64'
          $env:PATH = "$driverDir;$env:PATH"
          $env:QT_OPENGL = 'software'
          $env:QT_OPENGL_DLL = Join-Path $driverDir 'opengl32.dll'
          $env:GALLIUM_DRIVER = 'llvmpipe'
          ctest --test-dir build/desktop-ci -C Release --output-on-failure --no-tests=error

  portable-smoke:
    name: Windows x64 portable simulation
    needs: windows
    if: ${{ !cancelled() && needs.windows.outputs.smoke-kit-id != '' }}
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HEPLabWorkbench-win-x64-unsigned
          path: HEPLabWorkbench-win-x64
      - uses: actions/download-artifact@v4
        with:
          name: HEPLabWorkbench-win-x64-smoke
          path: HEPLabWorkbench-smoke
      - name: Run a simulation from the relocated bundle
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./HEPLabWorkbench-smoke/verify_windows_package.ps1 -Bundle ./HEPLabWorkbench-win-x64
