[package]
name = "heplab-physics"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Checked numerical and analytic vacuum physics engine for HEPLab"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "heplab-physics"
path = "src/main.rs"
