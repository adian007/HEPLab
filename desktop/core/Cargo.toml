[package]
name = "heplab-desktop-core"
version = "0.1.0-dev.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "Typed, bounded IPC validation and packaged-worker supervision for the HEPLab desktop shell"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
