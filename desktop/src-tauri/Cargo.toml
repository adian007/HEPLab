[package]
name = "heplab-desktop"
version = "0.1.0-dev.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "HEPLab desktop shell: webview workspace over a packaged, supervised worker"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde_json = "1"
heplab-desktop-core = { path = "../core" }
